# src/vic20uc.cfg
# Unexpanded VIC-20 cc65 C host.
# PRG load address: $1001, BASIC stub: 10 SYS 4112.
# Screen overlay VIC20UCDRV loads at $1E20 and is cleared before UI output.

SYMBOLS {
    __STACKTOP__: type = export, value = $1E00;
}

MEMORY {
    ZP:       start = $0002, size = $001A, type = rw, file = "", define = yes;
    CBUF:     start = $033C, size = $00C0, type = rw, file = "", define = yes;
    LOADADDR: start = $0FFF, size = $0002, type = ro, file = %O;
    RAM:      start = $1001, size = $0DFF, type = rw, file = %O, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP:  load = RAM,      type = ro;
    LOWCODE:  load = RAM,      type = ro, optional = yes;
    CODE:     load = RAM,      type = ro;
    RODATA:   load = RAM,      type = ro;
    DATA:     load = RAM,      type = rw;
    BSS:      load = CBUF,     type = bss, define = yes;
}
