# src/vic20_asm_u.cfg
# Unexpanded VIC-20 assembly host.
# PRG load address: $1001; BASIC stub: 10 SYS 4112.

MEMORY {
    LOADADDR: start = $0FFF, size = $0002, file = %O;
    RAM:      start = $1001, size = $0DFF, file = %O;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP:  load = RAM,      type = ro;
    CODE:     load = RAM,      type = ro;
    RODATA:   load = RAM,      type = ro;
    BSS:      load = RAM,      type = bss, define = yes;
}
