# src/vic20_asm_3k.cfg
# VIC-20 +3K assembly host.
# PRG load address: $0401; BASIC stub: 10 SYS 1040.
# The complete program and BSS must remain below screen RAM at $1E00.

MEMORY {
    LOADADDR: start = $03FF, size = $0002, file = %O;
    RAM:      start = $0401, size = $19FF, file = %O;
}

SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP:  load = RAM,      type = ro;
    CODE:     load = RAM,      type = ro;
    RODATA:   load = RAM,      type = ro;
    BSS:      load = RAM,      type = bss, define = yes;
}
