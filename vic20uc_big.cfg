# src/vic20uc.cfg
# Minimal linker configuration for the experimental unexpanded VIC-20 C host.
#
# The output is a normal PRG loading at $1001.  The first bytes in STARTUP are
# a tiny BASIC line "10 SYS 4112"; the real code starts at $1010.
#
# The complete program image plus BSS must fit below the default unexpanded
# VIC-20 screen RAM at $1E00.  The cc65 C software stack starts at $1E00 and
# grows downward into the remaining free space.

SYMBOLS {
    __STACKTOP__: type = export, value = $1E00;
}

MEMORY {
    ZP:       start = $0002, size = $001A, type = rw, file = "", define = yes;
    LOADADDR: start = $0FFF, size = $0002, type = ro, file = %O;
    RAM:      start = $1001, size = $3000, type = rw, file = %O, define = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    STARTUP:  load = RAM,      type = ro;
    LOWCODE:  load = RAM,      type = ro, optional = yes;
    CODE:     load = RAM,      type = ro;
    RODATA:   load = RAM,      type = ro;
    DATA:     load = RAM,      type = rw;
    BSS:      load = RAM,      type = bss, define = yes;
}
